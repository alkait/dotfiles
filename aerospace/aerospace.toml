# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Opt in to the current config semantics. See:
# https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []
# Window borders disabled. To bring them back, restore this entry above:
#   'exec-and-forget borders active_color=0xff00ff00 inactive_color=0x494d64 width=10.0'
# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
#on-focus-changed = "move-mouse window-lazy-center"
# Step AeroSpace aside (mode passthrough) while Microsoft Remote Desktop is focused
on-focus-changed = ['exec-and-forget ~/.config/aerospace/focus-mode.sh']
# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Focus the window under the mouse pointer as it moves. Disabled: focus only
# ever changes on an explicit click or keybinding, never from the pointer
# drifting over a window.
focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''
    alt-enter = 'exec-and-forget open -n /Applications/Ghostty.app'

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    cmd-alt-left = 'focus left'
    cmd-alt-down = 'focus down'
    cmd-alt-up = 'focus up'
    cmd-alt-right = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    cmd-alt-shift-left = 'move left'
    cmd-alt-shift-down = 'move down'
    cmd-alt-shift-up = 'move up'
    cmd-alt-shift-right = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-shift-minus = 'resize smart -50'
    alt-shift-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    # alt-<letter> brings an app to its own workspace (launching it there if needed) and goes to it.
    # Windows opened any other way (Dock, Spotlight, links) stay where they open.
    # Herdr opens in workspace A
    alt-a = 'exec-and-forget ~/.config/aerospace/herdr-workspace.sh'
    # Brave opens in workspace B, YouTube (Brave web app) in workspace Y, X (Brave web app) in workspace X
    alt-b = 'exec-and-forget ~/.config/aerospace/app-workspace.sh com.brave.Browser.origin B'
    alt-y = 'exec-and-forget ~/.config/aerospace/app-workspace.sh com.brave.Browser.origin.app.agimnkijcaahngcdmfeangaknmldooml Y'
    alt-f = 'exec-and-forget open -a Finder'
    alt-h = 'exec-and-forget open -n /Applications/HikYeah.app'
    # Dev browser (debug Brave instance for Claude's chrome-devtools MCP) opens in workspace D
    alt-d = 'exec-and-forget ~/.config/aerospace/dev-browser-workspace.sh'
    #alt-e = ''
    #alt-f = 'workspace F'
    #alt-i = 'workspace I'
    #alt-m = 'workspace M'
    #alt-n = 'workspace N'
    #alt-o = 'workspace O'
    #alt-p = 'workspace P'
    #alt-q = 'workspace Q'
    alt-r = 'balance-sizes'
    #alt-s = 'exec-and-forget open -n -a Terminal --args --working-directory=$HOME/Documents/code/alkait/sharpr-agent -e /bin/zsh -lc "claude"'
    alt-t = ['close-all-windows-but-current', 'mode main']
    #alt-u = 'workspace U'
    #alt-v = 'workspace V'
    # WhatsApp opens in workspace W
    alt-w = 'exec-and-forget ~/.config/aerospace/app-workspace.sh net.whatsapp.WhatsApp W'
    alt-x = 'exec-and-forget ~/.config/aerospace/app-workspace.sh com.brave.Browser.origin.app.lodlkdfmihgonocnmddehnfgiljnadcf X'
    #alt-y = 'workspace Y'
    #alt-z = 'workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    # The moved window drops fullscreen (so it tiles next to what's already there) and you follow it.
    # Letters match the app workspaces (alt-<letter>); alt-shift-f stays fullscreen.
    alt-shift-1 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 1']
    alt-shift-2 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 2']
    alt-shift-3 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 3']
    alt-shift-4 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 4']
    alt-shift-5 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 5']
    alt-shift-6 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 6']
    alt-shift-7 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 7']
    alt-shift-8 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 8']
    alt-shift-9 = ['fullscreen off', 'move-node-to-workspace --focus-follows-window 9']
    alt-shift-a = ['fullscreen off', 'move-node-to-workspace --focus-follows-window A']
    alt-shift-b = ['fullscreen off', 'move-node-to-workspace --focus-follows-window B']
    #alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = ['fullscreen off', 'move-node-to-workspace --focus-follows-window D']
    #alt-shift-e = 'move-node-to-workspace E'
    alt-shift-f = 'fullscreen --no-outer-gaps'
    #alt-shift-g = 'move-node-to-workspace G'
    #alt-shift-i = 'move-node-to-workspace I'
    #alt-shift-m = 'move-node-to-workspace M'
    #alt-shift-n = 'move-node-to-workspace N'
    #alt-shift-o = 'move-node-to-workspace O'
    #alt-shift-p = 'move-node-to-workspace P'
    #alt-shift-q = 'move-node-to-workspace Q'
    #alt-shift-r = 'move-node-to-workspace R'
    #alt-shift-s = 'move-node-to-workspace S'
    #alt-shift-t = 'move-node-to-workspace T'
    #alt-shift-u = 'move-node-to-workspace U'
    #alt-shift-v = 'move-node-to-workspace V'
    alt-shift-w = ['fullscreen off', 'move-node-to-workspace --focus-follows-window W']
    alt-shift-x = ['fullscreen off', 'move-node-to-workspace --focus-follows-window X']
    alt-shift-y = ['fullscreen off', 'move-node-to-workspace --focus-follows-window Y']
    #alt-shift-z = 'move-node-to-workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

    # See: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    #backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    cmd-alt-shift-left = ['join-with left', 'mode main']
    cmd-alt-shift-down = ['join-with down', 'mode main']
    cmd-alt-shift-up = ['join-with up', 'mode main']
    cmd-alt-shift-right = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# 'passthrough' mode: empty so all keys (alt-tab included) fall through to the
# focused app. Entered/exited automatically by focus-mode.sh (cmd-tab out of the
# remote session fires on-focus-changed and returns to main).
[mode.passthrough.binding]

